# DirBrowser global fallback for Laragon/Apache.
#
# 1. Copy this repository's index.php to:
#       C:/laragon/usr/dirbrowser/index.php
# 2. Include this file from a user-maintained Apache config file, for example:
#       Include "C:/laragon/usr/dirbrowser/laragon-dirbrowser.conf"
#
# DirectoryIndex keeps normal project index files first. DirBrowser is used only
# when the requested directory has no local index.php, index.html or index.htm.
DirectoryIndex index.php index.html index.htm /__dirbrowser__

# Internal-looking endpoint for DirectoryIndex. The PHP script rejects direct
# browser requests to /__dirbrowser__ and resolves all browsed paths against the
# active virtual host's DOCUMENT_ROOT.
Alias /__dirbrowser__ "C:/laragon/usr/dirbrowser/index.php"

<Directory "C:/laragon/usr/dirbrowser">
    Require all granted
</Directory>
